apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: frontend
        image: platform-frontend:1
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: platform-config}},{secretRef: {name: platform-secrets}}]
        startupProbe: {httpGet: {path: /, port: 8080}, failureThreshold: 30, periodSeconds: 2}
        readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 10}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec: {selector: {app: frontend}, ports: [{port: 80, targetPort: 8080}]}
