apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: platform, namespace: platform}
spec:
  ingressClassName: nginx
  rules:
  - host: platform.local
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 8000}}}}
      - {path: /auth, pathType: Prefix, backend: {service: {name: auth, port: {number: 8001}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 80}}}}
