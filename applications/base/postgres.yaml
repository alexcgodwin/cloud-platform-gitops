apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env: [{name: POSTGRES_DB, value: platform},{name: POSTGRES_USER, value: platform},{name: POSTGRES_PASSWORD, value: platform-change-me}]
        ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: platform}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
