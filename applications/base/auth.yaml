apiVersion: apps/v1
kind: Deployment
metadata: {name: auth}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: auth}}
  template:
    metadata: {labels: {app: auth}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: auth
        image: platform-auth:1
        ports: [{containerPort: 8001}]
        envFrom:
          - configMapRef:
              name: platform-config
        env:
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: platform-secrets
                key: JWT_SECRET
        startupProbe: {httpGet: {path: /health, port: 8001}, failureThreshold: 30, periodSeconds: 2}
        readinessProbe: {httpGet: {path: /health, port: 8001}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8001}, periodSeconds: 10}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        resources: {requests: {cpu: 100m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: auth}
spec: {selector: {app: auth}, ports: [{port: 8001, targetPort: 8001}]}
